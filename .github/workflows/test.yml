name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies on purpose: the device code has none, and the AES and
      # hash implementations are checked against published vectors rather than
      # against another library.
      - run: python -m unittest discover -s tests -v
      - run: make check-secrets
